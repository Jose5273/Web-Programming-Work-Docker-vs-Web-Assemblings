# =============================================================
# Docker Compose: starts the whole project with ONE command
#   docker compose up --build
# Then open http://localhost:8080
# =============================================================
services:

  # ---------- Backend: Node.js API ----------
  back:
    build: ./back              # build the image from back/Dockerfile
    environment:
      - PORT=3000
    # Not published to the host: only the frontend can reach it
    # through Docker's internal network.
    healthcheck:               # Docker checks that the API is alive
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Frontend: Nginx + HTML + Wasm ----------
  front:
    build: ./front             # build the image from front/Dockerfile
    ports:
      - "8080:80"              # host port 8080 -> container port 80
    depends_on:
      back:
        condition: service_healthy   # wait until the backend is healthy
