# =============================================================
# Nginx configuration for the frontend container
# =============================================================
server {
    listen 80;

    # Folder where the static files (HTML, JS, CSS, Wasm) live
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: any request to /api/... is forwarded to the
    # backend container. "back" is the service name in docker-compose.yml;
    # Docker's internal network resolves that name to the container IP.
    location /api/ {
        proxy_pass http://back:3000;
    }

    # .wasm files must be served with the "application/wasm" MIME type
    location ~ \.wasm$ {
        types { application/wasm wasm; }
    }
}
